name: SDK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate release candidate
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "${PACKAGE_VERSION}" = "${TAG_VERSION}"
          fi
          python -m ruff check policymesh tests examples scripts
          python -m mypy policymesh
          python -m py_compile $(find policymesh tests examples scripts -name '*.py' -type f | sort)
          python -m bandit -q -r policymesh tests examples scripts -ll
          python -m unittest discover -s tests
          python -m pip_audit --local

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
