name: SDK CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static checks
        run: |
          python -m ruff check policymesh tests examples scripts
          python -m mypy policymesh
          python -m py_compile $(find policymesh tests examples scripts -name '*.py' -type f | sort)

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Dependency audit
        run: python -m pip_audit --local

      - name: Dry-run examples
        run: |
          python examples/custom_agent.py
          python examples/openai_agent.py
          python examples/anthropic_claude_agent.py
          python examples/langchain_agent.py
          python examples/crewai_agent.py

      - name: Build package
        run: |
          python -m build
          python -m twine check dist/*
