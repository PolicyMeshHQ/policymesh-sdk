[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policymesh"
version = "0.4.0"
authors = [
  { name="PolicyMesh", email="support@policymesh.net" }
]
description = "Python SDK for the PolicyMesh AI Agent Control Platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]
dependencies = [
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "mypy>=1.8.0,<1.15",
    "pip-audit>=2.7.0",
    "ruff>=0.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "twine>=5.0.0",
    "types-requests>=2.31.0",
]

[project.urls]
"Homepage" = "https://policymesh.net"
"Bug Tracker" = "https://github.com/Hail15/policymesh-sdk/issues"
"Documentation" = "https://github.com/Hail15/policymesh-sdk"

[tool.setuptools.packages.find]
where = ["."]
include = ["policymesh*"]

[tool.setuptools.package-data]
policymesh = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
